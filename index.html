<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Tomas — Aissa</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
 
  <header>
    <h1>🍼 Tomas de Aissa</h1>
    <p id="fecha-header">cargando fecha...</p>
  </header>
 
  <div class="container">
 
    <!-- QUIEN -->
    <div class="card">
      <div class="card-title">¿Quién está dando la toma?</div>
      <div class="who-grid">
        <button class="who-btn" id="btn-bryan" onclick="selectWho('Bryan')">
          <div class="avatar">BR</div>
          Bryan
        </button>
        <button class="who-btn" id="btn-lucia" onclick="selectWho('Lucía')">
          <div class="avatar">LU</div>
          Lucía
        </button>
      </div>
    </div>
 
    <!-- HORA ESPERADA -->
    <div class="card">
      <div class="card-title">Hora esperada de la toma</div>
      <div class="toma-grid" id="toma-grid">
        <button class="toma-pill" onclick="selectToma(this, '06:00')">06:00</button>
        <button class="toma-pill" onclick="selectToma(this, '09:00')">09:00</button>
        <button class="toma-pill" onclick="selectToma(this, '12:00')">12:00</button>
        <button class="toma-pill" onclick="selectToma(this, '15:00')">15:00</button>
        <button class="toma-pill" onclick="selectToma(this, '18:00')">18:00</button>
        <button class="toma-pill" onclick="selectToma(this, '21:00')">21:00</button>
        <button class="toma-pill" onclick="selectToma(this, '00:00')">00:00</button>
        <button class="toma-pill" onclick="selectToma(this, '03:00')">03:00</button>
      </div>
    </div>
 
    <!-- HORA REAL -->
    <div class="card">
      <div class="card-title">Hora real de la toma</div>
      <div class="field">
        <input type="time" id="hora-real" />
      </div>
    </div>
 
    <!-- CANTIDAD -->
    <div class="card">
      <div class="card-title">Cantidad</div>
      <div class="oz-row">
        <div class="oz-box">
          <label>Leche materna (oz)</label>
          <div class="oz-controls">
            <button class="oz-btn" onclick="changeOz('materna', -0.5)">−</button>
            <div class="oz-val" id="val-materna">0</div>
            <button class="oz-btn" onclick="changeOz('materna', 0.5)">+</button>
          </div>
        </div>
        <div class="oz-box">
          <label>Fórmula (oz)</label>
          <div class="oz-controls">
            <button class="oz-btn" onclick="changeOz('formula', -0.5)">−</button>
            <div class="oz-val" id="val-formula">0</div>
            <button class="oz-btn" onclick="changeOz('formula', 0.5)">+</button>
          </div>
        </div>
      </div>
    </div>
 
    <!-- NOTAS -->
    <div class="card">
      <div class="card-title">Notas (opcional)</div>
      <div class="field">
        <textarea id="notas" placeholder="Ej: estuvo inquieta, durmió bien después, regurgitó un poco..."></textarea>
      </div>
    </div>
 
    <!-- SUBMIT -->
    <button class="submit-btn" id="submit-btn" onclick="guardarToma()">
      Guardar toma
    </button>
 
    <!-- HISTORIAL -->
    <div class="history-title">Tomas registradas hoy</div>
    <div id="historial"></div>
 
  </div>
 
  <div class="toast" id="toast"></div>
 
  <script src="app.js"></script>
</body>
</html>
